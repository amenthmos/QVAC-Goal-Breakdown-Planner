<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Goal Breakdown Planner</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: linear-gradient(160deg, #fff2e0 0%, #ffe3c2 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #5c3b12;
    display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; }
  .icon { font-size: 2rem; margin-bottom: 4px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #b5720f; font-weight: 800; text-align: center; }
  .subtitle { color: #93744a; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #fffcf7; border: 1px solid #ffdca6; border-radius: 16px; padding: 28px 26px; box-shadow: 0 4px 16px rgba(181,114,15,0.08); }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #5c3b12; }
  input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #f7cd8a;
    background: #fffdfa; color: #5c3b12; font-family: inherit; font-size: 1rem; margin-bottom: 18px;
  }
  input[type=text]:focus { outline: none; border-color: #b5720f; }
  button.action {
    width: 100%; padding: 13px 20px; border: none; border-radius: 10px; font-size: 1rem;
    font-weight: 700; font-family: inherit; cursor: pointer; background: #b5720f; color: #fff;
  }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  button.action:hover:not(:disabled) { background: #94590a; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #93744a; min-height: 1.2em; }
  #resultBox { margin-top: 18px; }
  ol.steps { padding-left: 22px; margin: 0; counter-reset: item; }
  ol.steps li { margin-bottom: 10px; line-height: 1.5; }
  .footer-note { color: #93744a; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #ffdca6;
    border-top-color: #b5720f; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🎯</div>
    <h1>Goal Breakdown Planner</h1>
    <p class="subtitle">Enter a big goal, get it broken into concrete milestones. 100% on-device.</p>

    <div class="card">
      <label for="goalInput">Your big goal</label>
      <input type="text" id="goalInput" placeholder="e.g. run a marathon, launch a side business" />
      <button class="action" id="generateBtn">Break It Down</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const goalInput = document.getElementById('goalInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const goal = goalInput.value.trim();
      if (!goal) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Breaking down your goal...';

      try {
        const res = await fetch('/api/breakdown', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ goal }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<ol class="steps">${data.milestones.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    goalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
